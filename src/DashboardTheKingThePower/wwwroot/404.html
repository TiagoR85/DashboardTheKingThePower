<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
        // GitHub Pages SPA redirect - store path in sessionStorage and redirect to index.html
        var path = window.location.pathname;
        var query = window.location.search;
        var hash = window.location.hash;
        sessionStorage.redirect = path + query + hash;
        window.location.replace('/DashboardTheKingThePower/');
    </script>
</head>
<body></body>
</html>
